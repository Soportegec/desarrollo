# ============================================================
# Supabase Keep Alive
# Previene que el proyecto Supabase sea pausado por inactividad.
# Ejecuta un HEAD mínimo a la API pública cada 4 días.
# No modifica ningún dato. No requiere credenciales admin.
# ============================================================

name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 10 */1 * *'  # Cada 3 días a las 10:00 UTC
  workflow_dispatch:          # Permite ejecución manual desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_CODE=$(curl --head \
            "${SUPABASE_URL}/rest/v1/tdepartamentos?select=id&limit=1" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}")

          echo "Supabase HTTP response: ${HTTP_CODE}"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -gt 299 ]; then
            echo "ERROR: Supabase respondio con codigo ${HTTP_CODE}. Revisar si el proyecto esta pausado."
            exit 1
          fi

          echo "OK: Supabase activo y respondiendo correctamente."
